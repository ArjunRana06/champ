services:
  - type: web
    name: ai-study-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ai-study-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ai-study-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ai-study-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ai-study-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ai-study-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: LOG_LEVEL
        value: warning
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: OPENROUTER_EMBEDDING_MODEL
        value: openai/text-embedding-3-small
    healthCheckPath: /health.txt

databases:
  - name: ai-study-db
    databaseName: ai_study_assistant
    plan: free
